name = "boss-proxy"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# .txt 파일(시스템 프롬프트)을 문자열로 그대로 import할 수 있게 하는 규칙
[[rules]]
type = "Text"
globs = ["**/*.txt"]
fallthrough = true

# 킬 스위치 플래그 + rate limit 카운터 저장용 KV.
# `wrangler kv namespace create boss-proxy-kv` 로 실제 생성한 뒤 id/preview_id를 채워주세요.
# (로컬 `wrangler dev`는 이 값이 채워져 있지 않아도 로컬 인메모리 KV로 동작합니다)
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_REAL_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_REAL_PREVIEW_KV_NAMESPACE_ID"
